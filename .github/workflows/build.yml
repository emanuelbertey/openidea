name: Build

# Compila el proyecto al pushear; no ejecuta tests.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: dist/
          retention-days: 7

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p ide-host --bin openidea-server
      - uses: actions/upload-artifact@v6
        with:
          name: openidea-server
          path: target/debug/openidea-server.exe
          retention-days: 7


  desktop:
    name: Desktop app (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with: { version: 11 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: Swatinem/rust-cache@v2
        with: { key: desktop-windows }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build Tauri app
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc
      - name: Portable exe
        shell: pwsh
        run: |
          $dir = 'target/x86_64-pc-windows-msvc/release'
          Compress-Archive -Path "$dir/openidea.exe" -DestinationPath 'OpenIDEA_windows_x64_portable.zip' -Force
      - uses: actions/upload-artifact@v6
        with:
          name: openidea-app-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/**
            OpenIDEA_windows_x64_portable.zip
          retention-days: 7
